<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendsor | The Vending Network</title>
    <style>
        :root {
            /* User Mode Colors (Default) */
            --bg-color: #0f172a;
            --grid-color: rgba(56, 189, 248, 0.2);
            --pin-color: #38bdf8;
            --pin-glow: 0 0 15px #38bdf8;
            --text-color: #f8fafc;
            --card-bg: rgba(15, 23, 42, 0.85);
            --view-angle: rotateX(60deg) rotateZ(-45deg) scale(1);
        }

        body.owner-mode {
            /* Owner Mode Colors */
            --bg-color: #1e1b4b;
            --grid-color: rgba(167, 139, 250, 0.2);
            --pin-color: #10b981; /* Healthy machine */
            --pin-glow: 0 0 15px #10b981;
            --card-bg: rgba(30, 27, 75, 0.85);
            /* Swoop the camera out slightly for management view */
            --view-angle: rotateX(55deg) rotateZ(-30deg) scale(0.85); 
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            transition: background-color 0.8s ease;
        }

        /* Navbar & Controls */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            /* Replace text with <img src="logo.png" height="40"> later */
        }

        /* The Toggle Switch */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 500;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .4s;
            border-radius: 34px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 3px;
            background-color: white;
            transition: .4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border-radius: 50%;
        }

        input:checked + .slider { background-color: #6366f1; }
        input:checked + .slider:before { transform: translateX(26px); }

        /* The 3D Simulation Canvas */
        .scene {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .map-grid {
            width: 800px;
            height: 800px;
            background-image: 
                linear-gradient(var(--grid-color) 2px, transparent 2px),
                linear-gradient(90deg, var(--grid-color) 2px, transparent 2px);
            background-size: 50px 50px;
            transform: var(--view-angle);
            transition: transform 1s cubic-bezier(0.25, 1, 0.5, 1), background-image 0.8s ease;
            position: relative;
            border: 1px solid var(--grid-color);
            box-shadow: 0 0 50px rgba(0,0,0,0.5) inset;
        }

        /* Vending Machine Pins */
        .pin {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: var(--pin-color);
            border-radius: 50%;
            box-shadow: var(--pin-glow);
            transform: translate(-50%, -50%) rotateX(-90deg); /* Stand up from grid */
            transition: all 0.5s ease;
            cursor: pointer;
        }

        /* Pin Placements */
        #pin1 { top: 30%; left: 40%; }
        #pin2 { top: 70%; left: 60%; }
        #pin3 { top: 50%; left: 20%; }

        /* Owner Mode specific pin overrides */
        body.owner-mode #pin2 {
            background-color: #ef4444; /* Red warning */
            box-shadow: 0 0 15px #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) rotateX(-90deg) scale(1); }
            50% { transform: translate(-50%, -50%) rotateX(-90deg) scale(1.3); }
            100% { transform: translate(-50%, -50%) rotateX(-90deg) scale(1); }
        }

        /* Glassmorphism UI Card */
        .ui-card {
            position: fixed;
            bottom: -300px; /* Hidden initially */
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px 16px 0 0;
            padding: 24px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
            transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.8s;
            z-index: 10;
        }

        .ui-card.active {
            bottom: 0;
        }

        .card-title { margin: 0 0 10px 0; font-size: 20px; }
        .card-data { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        
        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        body.owner-mode .action-btn { background: #10b981; }
        body.owner-mode .action-btn.warning { background: #ef4444; color: white; }

    </style>
</head>
<body>

    <header>
        <div class="logo">VENSOR</div>
        <div class="toggle-container">
            <span>Find Snacks</span>
            <label class="switch">
                <input type="checkbox" id="modeToggle">
                <span class="slider"></span>
            </label>
            <span>Manage Fleet</span>
        </div>
    </header>

    <div class="scene">
        <div class="map-grid">
            <div class="pin" id="pin1" onclick="openCard('pin1')"></div>
            <div class="pin" id="pin2" onclick="openCard('pin2')"></div>
            <div class="pin" id="pin3" onclick="openCard('pin3')"></div>
        </div>
    </div>

    <div class="ui-card" id="infoCard">
        <h3 class="card-title" id="cardTitle">Vending Machine #104</h3>
        <p class="card-data" id="cardData">Distance: 120m • Fully Stocked</p>
        <button class="action-btn" id="cardAction">Navigate Here</button>
    </div>

    <script>
        const toggle = document.getElementById('modeToggle');
        const body = document.body;
        const infoCard = document.getElementById('infoCard');
        const cardTitle = document.getElementById('cardTitle');
        const cardData = document.getElementById('cardData');
        const cardAction = document.getElementById('cardAction');

        // Handle the Flip between User and Owner mode
        toggle.addEventListener('change', () => {
            if(toggle.checked) {
                body.classList.add('owner-mode');
                infoCard.classList.remove('active'); // hide card on swap
            } else {
                body.classList.remove('owner-mode');
                infoCard.classList.remove('active');
            }
        });

        // Handle clicking on machines
        function openCard(pinId) {
            infoCard.classList.add('active');
            const isOwner = toggle.checked;

            if (!isOwner) {
                // User Perspective
                cardTitle.innerText = "Snack Station";
                cardData.innerText = "120m away • Cold drinks available";
                cardAction.innerText = "Navigate to Machine";
                cardAction.className = "action-btn"; 
            } else {
                // Owner Perspective
                if (pinId === 'pin2') {
                    cardTitle.innerText = "Machine #089 (UTown)";
                    cardData.innerText = "CRITICAL: Out of Cola. Est Revenue Loss: $15/hr";
                    cardAction.innerText = "Dispatch Restock Crew";
                    cardAction.className = "action-btn warning";
                } else {
                    cardTitle.innerText = "Machine #104";
                    cardData.innerText = "Status: Healthy • Inventory: 92% • Revenue: $42 today";
                    cardAction.innerText = "View Analytics";
                    cardAction.className = "action-btn";
                }
            }
        }

        // Close card if clicking background
        document.querySelector('.scene').addEventListener('click', (e) => {
            if(e.target.classList.contains('scene')) {
                infoCard.classList.remove('active');
            }
        });
    </script>
</body>
</html>
